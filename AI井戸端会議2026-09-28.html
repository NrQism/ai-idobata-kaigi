  function buildSummaryPrompt() {
    var body = state.log.map(function (e) {
      return '【' + e.speaker + '】\n' + e.text;
    }).join('\n\n');
    return 'あなたはAI井戸端会議の記録係です。\n\n' +
      '今回の議題:\n「' + state.topic + '」\n\n' +
      'これまでの発言は以下の通りです。\n\n' + body + '\n\n' +
      'ここまでの議論をまとめてください。各参加者の主張の要点、意見が分かれた点、' +
      '特に面白かった視点を整理してください。';
  }

  function onSummary() {
    var text = buildSummaryPrompt();
    utilityPreview = { label: 'まとめ依頼文', text: text };
    renderUtilityPreview();
    copyToClipboard(text);
  }

  function buildExportDocument() {
    var lines = [];
    lines.push('# AI井戸端会議 議事録');
    lines.push('');
    lines.push('議題: ' + state.topic);
    lines.push('');
    lines.push('総ターン数: ' + state.turnCount);
    lines.push('');
    lines.push('## 発言記録');
    lines.push('');
    state.log.forEach(function (e) {
      var label = e.mod ? 'ひとこと' : (e.intrude ? '乱入' : ('#' + e.turn));
      var tags = [];
      if (e.derail) tags.push('脱線');
      if (e.reaction) tags.push(e.reactionTo + 'に' + (REACTION_LABEL[e.reaction] || e.reaction));
      if (e.selfReaction) tags.push('AI自己判定:' + (REACTION_LABEL[e.selfReaction] || e.selfReaction));
      var tagStr = tags.length ? '［' + tags.join('・') + '］' : '';
      lines.push('### ' + label + ' ' + e.speaker + tagStr + '（' + fmtTime(e.time) + '）');
      lines.push('');
      lines.push(e.text);
      lines.push('');
    });
    return lines.join('\n');
  }

  function buildExportFilename() {
    var d = new Date();
    function pad(n) { return String(n).padStart(2, '0'); }
    return 'ai-idobata-kaigi_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.md';
  }

  function onExport() {
    var text = buildExportDocument();
    var filename = buildExportFilename();
    if (downloadsApi) {
      downloadsApi.save({ filename: filename, data: text }).then(function () {
        showToast('書き出しましたわ');
      }).catch(function (err) {
        if (err && err.code === 'declined') return;
        utilityPreview = { label: 'NotebookLM用資料', text: text };
        renderUtilityPreview();
        copyToClipboard(text);
      });
    } else {
      utilityPreview = { label: 'NotebookLM用資料', text: text };
      renderUtilityPreview();
      copyToClipboard(text);
    }
  }

  function genreChipsHtml() {
    return '<div class="genre-select" id="genreSelect">' + GENRES.map(function (g) {
      return '<button type="button" class="genre-chip' + (state.genre === g.key ? ' active' : '') +
        '" data-genre="' + g.key + '">' + g.label + '</button>';
    }).join('') + '</div>';
  }

  function bindGenreChips() {
    var box = document.getElementById('genreSelect');
    if (!box) return;
    box.querySelectorAll('.genre-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-genre');
        state.genre = (state.genre === key) ? '' : key;
        if (state.started) {
          genrePickerOpen = false;
          saveState();
        }
        renderTopicBar();
        renderRelationPanel();
      });
    });
  }

  function renderTopicBar() {
    var el = document.getElementById('topicBar');
    if (!state.started) {
      var chipsHtml = ALL_MEMBERS.map(function (name) {
        var cls = CLASS[name];
        var checked = state.order.indexOf(name) !== -1;
        return '<label class="member-chip' + (checked ? ' checked ' + cls : '') + '" data-member="' + name + '">' +
          '<input type="checkbox" value="' + name + '"' + (checked ? ' checked' : '') + '>' + name +
          '</label>';
      }).join('');

      el.innerHTML =
        '<div class="label">議題を決めてくださいまし</div>' +
        '<textarea id="topicInput" placeholder="例：AIだけで100年間活動したら何が起こるか？">' +
        escapeHtml(state.topic) + '</textarea>' +
        '<div class="label" style="margin-top:12px;">参加させるAIを選んでくださいまし(2人以上)</div>' +
        '<div class="member-select" id="memberSelect">' + chipsHtml + '</div>' +
        '<div class="label" style="margin-top:12px;">ジャンル(任意・相性をジャンル別に見るときに使いますの)</div>' +
        genreChipsHtml() +
        '<div class="label" style="margin-top:12px;">AIに自己判定を頼む(返答の最後に1行足してもらいますの)</div>' +
        '<div class="genre-select"><button type="button" class="genre-chip' + (state.selfJudge ? ' active' : '') + '" id="selfJudgeToggle">自己判定を依頼する(' + (state.selfJudge ? 'ON' : 'OFF') + ')</button></div>' +
        '<div class="label" style="margin-top:12px;">AIへの依頼文を補強する(参加者・直近の流れ・宛先確認を足しますの)</div>' +
        '<div class="genre-select"><button type="button" class="genre-chip' + (state.guide ? ' active' : '') + '" id="guideToggle">依頼文を補強する(' + (state.guide ? 'ON' : 'OFF') + ')</button></div>' +
        '<div class="row"><button class="primary-btn" id="startBtn">会議を始める</button></div>';

      document.getElementById('topicInput').addEventListener('input', function (e) {
        state.topic = e.target.value;
      });
      document.getElementById('memberSelect').querySelectorAll('input[type="checkbox"]').forEach(function (box) {
        box.addEventListener('change', function () {
          var name = box.value;
          var idx = state.order.indexOf(name);
          if (box.checked && idx === -1) {
            state.order = ALL_MEMBERS.filter(function (m) {
              return state.order.indexOf(m) !== -1 || m === name;
            });
          } else if (!box.checked && idx !== -1) {
            state.order.splice(idx, 1);
          }
          renderTopicBar();
        });
      });
      bindGenreChips();
      document.getElementById('selfJudgeToggle').addEventListener('click', function () {
        state.selfJudge = !state.selfJudge;
        renderTopicBar();
      });
      document.getElementById('guideToggle').addEventListener('click', function () {
        state.guide = !state.guide;
        renderTopicBar();
      });
      document.getElementById('startBtn').addEventListener('click', onStart);
    } else {
      var genreLabel = state.genre ? GENRE_LABEL[state.genre] : '';
      el.innerHTML =
        '<div class="label" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
        '<span>議題</span><span>' +
        (genreLabel ? '<span class="tag-badge">' + escapeHtml(genreLabel) + '</span> ' : '') +
        (state.selfJudge ? '<span class="tag-badge">自己判定あり</span> ' : '') +
        '<button type="button" class="ghost-btn" id="genreEditBtn" style="padding:2px 10px;font-size:0.72rem;">' +
        (genreLabel ? 'ジャンル変更' : 'ジャンルを付ける') + '</button></span></div>' +
        '<div class="topic-display">' + escapeHtml(state.topic) + '</div>' +
        (genrePickerOpen ? '<div style="margin-top:10px;">' + genreChipsHtml() + '</div>' : '');
      document.getElementById('genreEditBtn').addEventListener('click', function () {
        genrePickerOpen = !genrePickerOpen;
        renderTopicBar();
      });
      bindGenreChips();
    }
  }

  function onStart() {
    var topic = (state.topic || '').trim();
    if (!topic) {
      showToast('議題を入力してくださいまし');
      return;
    }
    if (!state.order || state.order.length < 2) {
      showToast('参加AIを2人以上選んでくださいまし');
      return;
    }
    state.topic = topic;
    state.started = true;
    state.turnIndex = 0;
    state.meetingId = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    state.startedAt = Date.now();
    var text = buildPrompt(topic, null, null, '', state.order[0]);
    state.lastGenerated = text;
    state.lastGeneratedFor = state.order[0];
    saveState();
    render();
    copyToClipboard(text);
  }

  function renderLog() {
    var el = document.getElementById('logArea');
    if (state.log.length === 0) {
      el.innerHTML = '<p class="empty-state">議題を決めて、会議を始めてくださいまし。発言が積み重なるとここに並びますわ。</p>';
      return;
    }

    var filterHtml = '<div class="log-filter">' +
      '<button class="ghost-btn" id="derailFilterBtn">' + (hideDerail ? '脱線も表示' : '脱線を隠す') + '</button>' +
      '</div>';

    var entries = state.log;
    if (hideDerail) {
      entries = entries.filter(function (e) { return !e.derail; });
    }
    var hiddenCount = 0;
    if (!logExpanded && entries.length > LOG_PAGE_SIZE) {
      hiddenCount = entries.length - LOG_PAGE_SIZE;
      entries = entries.slice(-LOG_PAGE_SIZE);
    }

    var loadMoreHtml = '';
    if (hiddenCount > 0) {
      loadMoreHtml = '<div class="log-load-more">' +
        '<button class="ghost-btn" id="logLoadMoreBtn">これより前を表示（あと' + hiddenCount + '件）</button>' +
        '</div>';
    } else if (logExpanded && entries.length > LOG_PAGE_SIZE) {
      loadMoreHtml = '<div class="log-load-more">' +
        '<button class="ghost-btn" id="logCollapseBtn">直近' + LOG_PAGE_SIZE + '件だけ表示</button>' +
        '</div>';
    }

    // 各発言の「ひとつ前の発言者」(タグ付けの対象)。乱入とひとことには付けられない
    var prevSpeakerOf = {};
    var lastSp = null;
    state.log.forEach(function (e) {
      if (e.mod) return;
      prevSpeakerOf[e.id] = e.intrude ? null : lastSp;
      if (!e.intrude) lastSp = e.speaker;
    });

    var html = entries.map(function (entry) {
      var cls = entry.mod ? 'moderator' : (CLASS[entry.speaker] || '');
      var turnLabel = entry.mod ? 'ひとこと' : (entry.intrude ? '乱入' : ('#' + entry.turn));
      var icon = entry.mod ? '…' : (ICON[entry.speaker] || '');
      var badges = '';
      if (entry.intrude) badges += '<span class="tag-badge intrude-badge">乱入</span>';
      if (entry.derail) badges += '<span class="tag-badge derail-badge">脱線</span>';
      if (entry.reaction) badges += '<span class="tag-badge reaction-badge">→' + entry.reactionTo + 'に' + (REACTION_LABEL[entry.reaction] || entry.reaction) + '</span>';
      if (entry.selfReaction) {
        var mism = entry.reaction && entry.reaction !== entry.selfReaction;
        badges += '<span class="tag-badge self-badge' + (mism ? ' mismatch' : '') + '">AI自己判定:' +
          (REACTION_LABEL[entry.selfReaction] || entry.selfReaction) +
          (entry.selfConf ? '(確度' + entry.selfConf + ')' : '') +
          (mism ? '・議長と不一致' : '') + '</span>';
      }
      var derailToggleBtn = entry.mod ? '' :
        '<button class="small-btn derail-toggle" data-id="' + entry.id + '">' + (entry.derail ? '脱線を外す' : '脱線にする') + '</button>';
      var prevSp = prevSpeakerOf[entry.id];
      var tagEditBtn = (!entry.mod && !entry.intrude && prevSp) ?
        '<button class="small-btn tag-edit-toggle" data-id="' + entry.id + '">' + (entry.reaction ? 'タグを直す' : 'タグを付ける') + '</button>' : '';
      var editorHtml = '';
      if (tagEditBtn && editingTagId === entry.id) {
        editorHtml = '<div class="tag-editor"><span>→' + escapeHtml(prevSp) + 'への反応:</span>' +
          REACTION_TYPES.map(function (r) {
            return '<button type="button" class="genre-chip edit-chip' + (entry.reaction === r.key ? ' active' : '') +
              '" data-id="' + entry.id + '" data-key="' + r.key + '">' + r.label + '</button>';
          }).join('') +
          '<button type="button" class="genre-chip edit-chip' + (!entry.reaction ? ' active' : '') +
          '" data-id="' + entry.id + '" data-key="">タグなし</button></div>';
      }
      var actionsHtml = derailToggleBtn + tagEditBtn;
      return '<div class="log-entry ' + cls + (entry.derail ? ' is-derail' : '') + '">' +
        '<div class="meta">' +
        '<span class="turn-no">' + turnLabel + '</span>' +
        '<span class="speaker-tag ' + cls + '">' + icon + ' ' + entry.speaker + '</span>' +
        '<span class="time">' + fmtTime(entry.time) + '</span>' +
        badges +
        '</div>' +
        '<div class="text">' + escapeHtml(entry.text) + '</div>' +
        (actionsHtml ? '<div class="entry-actions">' + actionsHtml + '</div>' : '') +
        editorHtml +
        '</div>';
    }).join('');

    el.innerHTML = filterHtml + loadMoreHtml + html;

    document.getElementById('derailFilterBtn').addEventListener('click', function () {
      hideDerail = !hideDerail;
      renderLog();
    });
    el.querySelectorAll('.derail-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        onToggleDerail(btn.getAttribute('data-id'));
      });
    });
    el.querySelectorAll('.tag-edit-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        editingTagId = (editingTagId === id) ? null : id;
        renderLog();
      });
    });
    el.querySelectorAll('.edit-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        onSetReaction(btn.getAttribute('data-id'), btn.getAttribute('data-key'));
      });
    });
    var loadMoreBtn = document.getElementById('logLoadMoreBtn');
    if (loadMoreBtn) {
      loadMoreBtn.addEventListener('click', function () {
        logExpanded = true;
        renderLog();
      });
    }
    var collapseBtn = document.getElementById('logCollapseBtn');
    if (collapseBtn) {
      collapseBtn.addEventListener('click', function () {
        logExpanded = false;
        renderLog();
        var stickyTop = document.getElementById('stickyTop');
        stickyTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  // AIが「別のAI宛の文章だったようですが…」と指摘してきた返答を、貼り付けの時点で見つける。
  // 指摘は冒頭に書くよう頼んであるので、先頭の300文字だけを見る
  var MISADDRESS_RE = /(ChatGPT|Claude|Gemini|Perplexity)\s*(?:さん)?\s*宛て?(?:の)?\s*(?:文章|文面|メッセージ|依頼文|プロンプト|お願い|内容)?\s*(?:だった|でした|だと思|のよう|みたい|かと思|らしい)/;

  function detectMisaddress(text) {
    var m = MISADDRESS_RE.exec(String(text).slice(0, 300));
    return m ? m[1] : null;
  }

  // 疑わしいときは記録せずに注意を出す。「このまま記録する」を押した直後の1回だけは素通しする
  function checkMisaddress(text, expected, override) {
    if (override) {
      misaddressNotice = null;
      return false;
    }
    var hit = detectMisaddress(text);
    if (!hit) {
      misaddressNotice = null;
      return false;
    }
    misaddressNotice = { mentioned: hit, expected: expected };
    rerenderKeepingInputs();
    var n = document.getElementById('misaddressNotice');
    if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest' });
    return true;
  }

  function misaddressNoticeHtml() {
    if (!misaddressNotice) return '';
    return '<div class="misaddress-notice" id="misaddressNotice">' +
      '<div>この返答に、「' + escapeHtml(misaddressNotice.mentioned) + '宛の文章だったようですが…」という趣旨の指摘が含まれています。' +
      'いま記録しようとしているのは' + escapeHtml(misaddressNotice.expected) + 'の発言ですので、別のAIに貼り間違えたのかもしれませんの。</div>' +
      '<div class="misaddress-actions">' +
      '<button type="button" class="ghost-btn" id="misaddressRetryBtn">貼り直す</button>' +
      '<button type="button" class="small-btn" id="misaddressForceBtn">このまま記録する</button>' +
      '</div></div>';
  }

  function bindMisaddress() {
    var ri = document.getElementById('replyInput');
    if (ri) {
      ri.addEventListener('input', function () {
        if (!misaddressNotice) return;
        misaddressNotice = null;
        var n = document.getElementById('misaddressNotice');
        if (n && n.parentNode) n.parentNode.removeChild(n);
      });
    }
    var retry = document.getElementById('misaddressRetryBtn');
    if (retry) {
      retry.addEventListener('click', function () {
        misaddressNotice = null;
        rerenderKeepingInputs();
        var r = document.getElementById('replyInput');
        if (r) {
          r.value = '';
          r.focus();
        }
      });
    }
    var force = document.getElementById('misaddressForceBtn');
    if (force) {
      force.addEventListener('click', function () {
        misaddressOverride = true;
        if (state.pendingIntrude) onIntrudeNext(); else onNext();
      });
    }
  }

  // 反応チップや乱入ボタンなどでパネルを描き直しても、入力途中の文章が消えないようにする
  function rerenderKeepingInputs() {
    var r = document.getElementById('replyInput');
    var a = document.getElementById('asideInput');
    var replyValue = r ? r.value : '';
    var asideValue = a ? a.value : '';
    renderTurnPanel();
    var r2 = document.getElementById('replyInput');
    var a2 = document.getElementById('asideInput');
    if (r2 && replyValue) r2.value = replyValue;
    if (a2 && asideValue) a2.value = asideValue;
  }

  function renderTurnPanel() {
    var panel = document.getElementById('turnPanel');
    var inner = document.getElementById('turnPanelInner');

    if (archivePanelOpen || relationPanelOpen) {
      panel.style.display = 'none';
      return;
    }

    if (!state.started) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';

    var previewHtml = '';
    if (state.lastGenerated) {
      previewHtml =
        '<div class="preview-box">' +
        '<div class="label"><span>' + state.lastGeneratedFor + '用の文章</span>' +
        '<button class="small-btn" id="recopyBtn">再コピー</button></div>' +
        '<textarea readonly id="previewText">' + escapeHtml(state.lastGenerated) + '</textarea>' +
        '</div>';
    }

    if (state.pendingIntrude) {
      var iSpeaker = state.pendingIntrude;
      var iCls = CLASS[iSpeaker] || '';
      inner.innerHTML =
        '<div class="turn-topic">議題: ' + escapeHtml(state.topic) + '</div>' +
        '<span class="speaker-badge ' + iCls + '">' + (ICON[iSpeaker] || '') + ' ' + iSpeaker + 'が乱入！</span>' +
        '<textarea id="replyInput" placeholder="' + iSpeaker + 'の乱入発言をここに貼り付けてくださいまし"></textarea>' +
        misaddressNoticeHtml() +
        '<div class="row">' +
        '<button class="ghost-btn" id="intrudeCancelBtn">乱入をやめる</button>' +
        '<button class="primary-btn" id="nextBtn">乱入をログに追加</button>' +
        '</div>' +
        previewHtml;

      document.getElementById('nextBtn').addEventListener('click', onIntrudeNext);
      document.getElementById('intrudeCancelBtn').addEventListener('click', onIntrudeCancel);
      bindMisaddress();
      var recopy0 = document.getElementById('recopyBtn');
      if (recopy0) recopy0.addEventListener('click', function () { copyToClipboard(state.lastGenerated); });
      panel.scrollTop = 0;
      return;
    }

    var speaker = currentSpeaker();
    var cls = CLASS[speaker];

    var cardsHtml = '<div class="mod-cards">' + MOD_CARDS.map(function (c, i) {
      return '<button class="small-btn mod-card-btn" data-i="' + i + '">' + c.label + '</button>';
    }).join('') + '</div>';

    var reactionHtml = '';
    var reactTarget = lastRealEntry();
    if (reactTarget) {
      reactionHtml = '<div class="reaction-row">' +
        '<span class="hint">前の(' + reactTarget.speaker + 'の)発言への反応(任意)：</span>' +
        REACTION_TYPES.map(function (r) {
          return '<button class="small-btn tag-chip' + (pendingReaction === r.key ? ' active' : '') + '" data-key="' + r.key + '">' + r.label + '</button>';
        }).join('') +
        '</div>';
    }

    var intrudePickerHtml = '';
    if (intrudePickerOpen) {
      intrudePickerHtml = '<div class="intrude-picker">' +
        ALL_MEMBERS.map(function (name) {
          return '<button class="small-btn intrude-pick-btn" data-name="' + name + '">' + name + '</button>';
        }).join('') + '</div>';
    }

    inner.innerHTML =
      '<div class="turn-topic">議題: ' + escapeHtml(state.topic) + '</div>' +
      '<span class="speaker-badge ' + cls + '">' + (ICON[speaker] || '') + ' ' + speaker + 'の番ですわ</span>' +
      exchangeWarningHtml() +
      '<textarea id="replyInput" placeholder="' + speaker + 'の発言をここに貼り付けてくださいまし"></textarea>' +
      misaddressNoticeHtml() +
      reactionHtml +
      '<div class="label" style="margin-top:8px;">議長アクションカード(任意、ひとことに挿入)</div>' +
      cardsHtml +
      '<textarea id="asideInput" class="aside-textarea" placeholder="ひとこと・相槌があれば(任意、次のAIにも軽く伝わりますの)"></textarea>' +
      '<div class="row">' +
      '<button class="ghost-btn" id="intrudeBtn">乱入させる</button>' +
      '<button class="primary-btn" id="nextBtn">次のAI用にコピー</button>' +
      '</div>' +
      intrudePickerHtml +
      previewHtml;

    document.getElementById('nextBtn').addEventListener('click', onNext);
    bindMisaddress();
    var recopy = document.getElementById('recopyBtn');
    if (recopy) {
      recopy.addEventListener('click', function () {
        copyToClipboard(state.lastGenerated);
      });
    }
    document.getElementById('intrudeBtn').addEventListener('click', function () {
      intrudePickerOpen = !intrudePickerOpen;
      rerenderKeepingInputs();
    });
    inner.querySelectorAll('.intrude-pick-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        onIntrudeChoose(btn.getAttribute('data-name'));
      });
    });
    inner.querySelectorAll('.mod-card-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var c = MOD_CARDS[parseInt(btn.getAttribute('data-i'), 10)];
        var aside = document.getElementById('asideInput');
        if (aside) aside.value = c.text;
      });
    });
    inner.querySelectorAll('.tag-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-key');
        pendingReaction = (pendingReaction === key) ? null : key;
        rerenderKeepingInputs();
      });
    });
    panel.scrollTop = 0;
  }

  function onNext() {
    var override = misaddressOverride;
    misaddressOverride = false;
    var input = document.getElementById('replyInput');
    var text = input.value.trim();
    if (!text) {
      showToast(currentSpeaker() + 'の発言を貼り付けてくださいまし');
      return;
    }
    if (checkMisaddress(text, currentSpeaker(), override)) return;
    var asideInput = document.getElementById('asideInput');
    var asideText = asideInput ? asideInput.value.trim() : '';

    var speaker = currentSpeaker();
    var reactTarget = lastRealEntry();
    var judged = state.selfJudge ? extractSelfJudgment(text) : { text: text, judge: null };
    if (!judged.text) judged = { text: text, judge: null };
    text = judged.text;
    state.turnCount += 1;
    var entry = {
      id: genId('e'),
      turn: state.turnCount,
      speaker: speaker,
      time: Date.now(),
      text: text
    };
    if (pendingReaction && reactTarget) {
      entry.reaction = pendingReaction;
      entry.reactionTo = reactTarget.speaker;
    }
    if (judged.judge) {
      entry.selfReaction = judged.judge.key;
      if (judged.judge.conf) entry.selfConf = judged.judge.conf;
    }
    state.log.push(entry);

    if (asideText) {
      state.log.push({
        id: genId('m'),
        turn: null,
        speaker: '議長',
        time: Date.now(),
        text: asideText,
        mod: true
      });
    }

    pendingReaction = null;
    state.turnIndex = (state.turnIndex + 1) % state.order.length;
    var nextSpeaker = currentSpeaker();
    var promptText = buildPrompt(state.topic, speaker, text, asideText, nextSpeaker);
    state.lastGenerated = promptText;
    state.lastGeneratedFor = nextSpeaker;

    saveState();
    render();
    copyToClipboard(promptText);

    var logArea = document.getElementById('logArea');
    logArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function onIntrudeChoose(name) {
    var lastEntry = lastSpokenEntry();
    var text = buildIntrudePrompt(state.topic, lastEntry, name);
    state.pendingIntrude = name;
    state.lastGenerated = text;
    state.lastGeneratedFor = name;
    intrudePickerOpen = false;
    saveState();
    render();
    copyToClipboard(text);
  }

  function onIntrudeCancel() {
    state.pendingIntrude = null;
    var last = lastSpokenEntry();
    var promptText = last
      ? buildPrompt(state.topic, last.speaker, last.text, '', currentSpeaker())
      : buildPrompt(state.topic, null, null, '', currentSpeaker());
    state.lastGenerated = promptText;
    state.lastGeneratedFor = currentSpeaker();
    saveState();
    render();
    showToast('乱入をやめましたわ');
  }

  function onIntrudeNext() {
    var override = misaddressOverride;
    misaddressOverride = false;
    var input = document.getElementById('replyInput');
    var text = input.value.trim();
    var intruder = state.pendingIntrude;
    if (!text) {
      showToast(intruder + 'の乱入発言を貼り付けてくださいまし');
      return;
    }
    if (checkMisaddress(text, intruder, override)) return;
    var judgedI = state.selfJudge ? extractSelfJudgment(text) : { text: text, judge: null };
    if (!judgedI.text) judgedI = { text: text, judge: null };
    text = judgedI.text;
    var iEntry = {
      id: genId('i'),
      turn: null,
      speaker: intruder,
      time: Date.now(),
      text: text,
      intrude: true
    };
    if (judgedI.judge) {
      iEntry.selfReaction = judgedI.judge.key;
      if (judgedI.judge.conf) iEntry.selfConf = judgedI.judge.conf;
    }
    state.log.push(iEntry);
    state.pendingIntrude = null;

    var nextSpeaker = currentSpeaker();
    var promptText = buildPrompt(state.topic, intruder, text, '', nextSpeaker);
    state.lastGenerated = promptText;
    state.lastGeneratedFor = nextSpeaker;

    saveState();
    render();
    copyToClipboard(promptText);

    var logArea = document.getElementById('logArea');
    logArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  // 反応タグの付け直し。反応先は、その発言より前にいた直近の(乱入・ひとことを除く)発言者
  function onSetReaction(id, key) {
    var idx = -1;
    for (var i = 0; i < state.log.length; i++) {
      if (state.log[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;
    var prev = null;
    for (var j = idx - 1; j >= 0; j--) {
      if (!state.log[j].mod && !state.log[j].intrude) { prev = state.log[j]; break; }
    }
    if (!prev) return;
    var entry = state.log[idx];
    if (key) {
      entry.reaction = key;
      entry.reactionTo = prev.speaker;
    } else {
      delete entry.reaction;
      delete entry.reactionTo;
    }
    editingTagId = null;
    saveState();
    renderLog();
    renderRelationPanel();
  }

  function onToggleDerail(id) {
    var entry = state.log.filter(function (e) { return e.id === id; })[0];
    if (!entry) return;
    entry.derail = !entry.derail;
    saveState();
    renderLog();
  }

  function onReset() {
    if (!confirm('会議のログをすべて削除して最初からやり直しますの。よろしいですか？')) return;
    if (state.started && state.log.length > 0) {
      mergeMeetingIntoArchive(buildCurrentMeetingRecord());
      saveArchiveStore();
    }
    state = {
      topic: '',
      started: false,
      turnIndex: 0,
      turnCount: 0,
      log: [],
      lastGenerated: '',
      lastGeneratedFor: '',
      order: DEFAULT_ORDER.slice(),
      meetingId: '',
      startedAt: null,
      pendingIntrude: null,
      genre: '',
      selfJudge: true,
      guide: true
    };
    genrePickerOpen = false;
    editingTagId = null;
    misaddressNotice = null;
    misaddressOverride = false;
    logExpanded = false;
    pendingReaction = null;
    saveState();
    render();
    showToast('リセットしましたわ（この会議はアーカイブに残っていますの）');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.getElementById('resetBtn').addEventListener('click', onReset);
  document.getElementById('archiveToggleBtn').addEventListener('click', function () {
    archivePanelOpen = !archivePanelOpen;
    if (archivePanelOpen) relationPanelOpen = false;
    renderArchivePanel();
    renderRelationPanel();
    rerenderKeepingInputs();
  });
  document.getElementById('relationToggleBtn').addEventListener('click', function () {
    relationPanelOpen = !relationPanelOpen;
    if (relationPanelOpen) archivePanelOpen = false;
    renderArchivePanel();
    renderRelationPanel();
    rerenderKeepingInputs();
  });
  document.getElementById('archiveFileInput').addEventListener('change', onArchiveFileSelected);

  (function initScrollWatch() {
    var stickyTop = document.getElementById('stickyTop');
    var backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', function () {
      var scrolled = window.scrollY > 40;
      stickyTop.classList.toggle('is-stuck', scrolled);
      backToTop.style.display = window.scrollY > 400 ? 'block' : 'none';
    }, { passive: true });
    backToTop.addEventListener('click', function () {
      stickyTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  })();

  render();
})();
</script>

</body>
</html>
